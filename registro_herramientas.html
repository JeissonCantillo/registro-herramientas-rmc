<!-- Prototipo: Registro de Herramientas RMC -->
<style>
  :root{
    --rmc-red:#C8102E;
    --rmc-red-dark:#8f0b20;
    --ink:#1c1f22;
    --steel:#3a4048;
    --steel-light:#5a626c;
    --bg:#f0f1f0;
    --panel:#ffffff;
    --line:#d7dade;
    --amber:#ffb703;
    --ok:#1f7a3d;
    --mono: 'Consolas', 'SF Mono', monospace;
    --sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  #rmc-app{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--bg);
    min-height:100%;
    padding:0;
    margin:0;
  }
  .rmc-header{
    background:var(--ink);
    color:#fff;
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:4px solid var(--rmc-red);
  }
  .rmc-logo{
    font-weight:800;
    font-size:20px;
    letter-spacing:0.5px;
    color:var(--rmc-red);
    background:#fff;
    padding:2px 10px;
    border-radius:3px;
  }
  .rmc-title{
    font-size:14px;
    color:#c9ccd0;
    letter-spacing:0.3px;
  }
  .rmc-body{
    padding:20px;
    max-width:980px;
    margin:0 auto;
  }
  .rmc-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:20px;
    margin-bottom:16px;
  }
  .rmc-role-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:640px){
    .rmc-role-grid{grid-template-columns:1fr;}
  }
  .rmc-role-btn{
    border:2px solid var(--line);
    background:#fff;
    border-radius:6px;
    padding:22px 16px;
    text-align:left;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
  }
  .rmc-role-btn:hover{border-color:var(--rmc-red);}
  .rmc-role-btn:active{transform:scale(0.99);}
  .rmc-role-btn h3{margin:0 0 6px 0; font-size:16px; color:var(--ink);}
  .rmc-role-btn p{margin:0; font-size:13px; color:var(--steel-light); line-height:1.4;}
  .rmc-code{
    font-family:var(--mono);
    font-size:44px;
    letter-spacing:10px;
    font-weight:700;
    color:var(--rmc-red-dark);
    background:#fff8f0;
    border:2px dashed var(--rmc-red);
    border-radius:8px;
    padding:16px 10px;
    text-align:center;
    margin:14px 0;
  }
  .rmc-label{
    font-size:12px;
    font-weight:700;
    color:var(--steel-light);
    text-transform:uppercase;
    letter-spacing:0.4px;
    display:block;
    margin-bottom:6px;
  }
  input[type=text], input[type=number], input[type=tel]{
    width:100%;
    padding:10px 12px;
    font-size:15px;
    border:1px solid var(--line);
    border-radius:5px;
    font-family:var(--sans);
    background:#fff;
    color:var(--ink);
  }
  input:focus{outline:2px solid var(--rmc-red); outline-offset:1px;}
  .rmc-btn{
    background:var(--rmc-red);
    color:#fff;
    border:none;
    padding:12px 18px;
    font-size:15px;
    font-weight:600;
    border-radius:5px;
    cursor:pointer;
    width:100%;
  }
  .rmc-btn:hover{background:var(--rmc-red-dark);}
  .rmc-btn:disabled{background:#c7c9cc; cursor:not-allowed;}
  .rmc-btn-secondary{
    background:#fff;
    color:var(--ink);
    border:1px solid var(--line);
  }
  .rmc-btn-secondary:hover{border-color:var(--steel);}
  .rmc-row{display:flex; gap:10px; margin-top:10px;}
  .rmc-row > *{flex:1;}
  .rmc-table-wrap{overflow-x:auto;}
  table.rmc-table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  table.rmc-table th{
    background:var(--ink);
    color:#fff;
    padding:8px 6px;
    text-align:left;
    white-space:nowrap;
  }
  table.rmc-table td{
    border:1px solid var(--line);
    padding:6px;
  }
  table.rmc-table td input{
    border:none;
    padding:4px;
    font-size:13px;
    background:transparent;
  }
  table.rmc-table td input:focus{background:#fff8f0;}
  .rmc-empty-row td{
    color:var(--steel-light);
    font-style:italic;
    text-align:center;
  }
  .rmc-pill{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:99px;
    background:#eaf6ee;
    color:var(--ok);
    margin-left:8px;
  }
  .rmc-photo-preview{
    width:100%;
    max-height:280px;
    object-fit:contain;
    background:#111;
    border-radius:6px;
    margin:10px 0;
  }
  .rmc-result-card{
    background:#fbfbf8;
    border:1px solid var(--line);
    border-left:4px solid var(--rmc-red);
    border-radius:4px;
    padding:14px;
    margin:14px 0;
  }
  .rmc-field{margin-bottom:10px;}
  .rmc-toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:12px 20px;
    border-radius:6px;
    font-size:14px;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    z-index:999;
  }
  .rmc-spinner{
    display:inline-block;
    width:16px;height:16px;
    border:2px solid rgba(255,255,255,0.4);
    border-top-color:#fff;
    border-radius:50%;
    animation:rmc-spin .7s linear infinite;
    margin-right:8px;
    vertical-align:-3px;
  }
  @keyframes rmc-spin{to{transform:rotate(360deg);}}
  .rmc-back{
    background:none;
    border:none;
    color:var(--steel-light);
    font-size:13px;
    cursor:pointer;
    padding:0;
    margin-bottom:14px;
    text-decoration:underline;
  }
  .rmc-muted{color:var(--steel-light); font-size:13px; line-height:1.5;}
</style>

<div id="rmc-app">
  <div class="rmc-header">
    <span class="rmc-logo">RMC</span>
    <span class="rmc-title">Registro de Salida y Entrada de Herramientas — Prototipo</span>
  </div>
  <div class="rmc-body" id="rmc-root"></div>
</div>

<script>
(function(){
  const root = document.getElementById('rmc-root');
  let state = { view: 'home', sessionCode: null, pollTimer: null, phoneStep: 'connect', photoBase64: null, aiResult: null };

  function today(){
    const d = new Date();
    return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
  }

  function showToast(msg){
    const t = document.createElement('div');
    t.className = 'rmc-toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2600);
  }

  async function getSession(code){
    try{
      const res = await window.storage.get('session:' + code, true);
      return res ? JSON.parse(res.value) : null;
    }catch(e){
      return null;
    }
  }

  async function saveSession(code, data){
    try{
      await window.storage.set('session:' + code, JSON.stringify(data), true);
      return true;
    }catch(e){
      console.error('Error guardando sesion', e);
      return false;
    }
  }

  function genCode(){
    return String(Math.floor(1000 + Math.random()*9000));
  }

  // ---------- HOME ----------
  function renderHome(){
    root.innerHTML = `
      <div class="rmc-card">
        <p class="rmc-muted" style="margin-top:0">Elige cómo vas a usar este prototipo en este dispositivo.</p>
        <div class="rmc-role-grid">
          <div class="rmc-role-btn" id="btn-pc">
            <h3>🖥️ Estación del PC (bodega)</h3>
            <p>Genera un código de sesión y muestra la tabla en vivo con los registros que lleguen desde el celular.</p>
          </div>
          <div class="rmc-role-btn" id="btn-phone">
            <h3>📷 Tomar foto (celular)</h3>
            <p>Conéctate con el código del PC, toma la foto de la herramienta y envía el registro.</p>
          </div>
        </div>
      </div>
      <div class="rmc-card rmc-muted">
        Este es un <strong>prototipo funcional</strong> para validar el flujo. La foto se analiza con IA para sugerir
        marca + modelo + tipo de herramienta; tú siempre puedes editar el resultado antes de enviarlo.
      </div>
    `;
    document.getElementById('btn-pc').onclick = () => { state.view='pc-setup'; render(); };
    document.getElementById('btn-phone').onclick = () => { state.view='phone-connect'; render(); };
  }

  // ---------- PC SETUP ----------
  function renderPcSetup(){
    root.innerHTML = `
      <button class="rmc-back" id="back">← Volver</button>
      <div class="rmc-card">
        <h3 style="margin-top:0">Estación del PC</h3>
        <p class="rmc-muted">Genera un código nuevo y compártelo (dilo en voz alta o muéstralo) para que desde el celular se conecten a esta sesión.</p>
        <button class="rmc-btn" id="gen">Generar código de sesión</button>
      </div>
    `;
    document.getElementById('back').onclick = () => { state.view='home'; render(); };
    document.getElementById('gen').onclick = async () => {
      const code = genCode();
      const ok = await saveSession(code, { items: [], createdAt: Date.now() });
      if(ok){
        state.sessionCode = code;
        state.view = 'pc-dashboard';
        render();
      } else {
        showToast('No se pudo crear la sesión, intenta de nuevo.');
      }
    };
  }

  // ---------- PC DASHBOARD ----------
  function renderPcDashboard(){
    root.innerHTML = `
      <button class="rmc-back" id="back">← Terminar sesión</button>
      <div class="rmc-card">
        <span class="rmc-label">Código de sesión (ingrésalo en el celular)</span>
        <div class="rmc-code">${state.sessionCode}</div>
        <p class="rmc-muted" style="text-align:center">Esta tabla se actualiza sola cuando llega un registro nuevo desde el celular <span class="rmc-pill" id="live-pill">● en vivo</span></p>
      </div>
      <div class="rmc-card">
        <div class="rmc-table-wrap">
          <table class="rmc-table" id="rmc-table">
            <thead>
              <tr>
                <th>ID</th><th>Cant. Salida</th><th>Descripción</th><th>Fecha Salida</th>
                <th>Firma</th><th>Cant. Ingreso</th><th>Fecha Entrada</th><th>Firma</th><th>Observaciones</th>
              </tr>
            </thead>
            <tbody id="rmc-tbody">
              <tr class="rmc-empty-row"><td colspan="9">Esperando registros desde el celular…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="rmc-row" style="margin-top:16px">
          <button class="rmc-btn rmc-btn-secondary" id="export-xlsx">⬇ Exportar a Excel (.xlsx)</button>
        </div>
      </div>
    `;
    document.getElementById('back').onclick = () => {
      if(state.pollTimer) clearInterval(state.pollTimer);
      state.view='home'; render();
    };
    document.getElementById('export-xlsx').onclick = exportXlsx;
    startPolling();
  }

  function renderTableRows(items){
    const tbody = document.getElementById('rmc-tbody');
    if(!tbody) return;
    if(!items || items.length === 0){
      tbody.innerHTML = '<tr class="rmc-empty-row"><td colspan="9">Esperando registros desde el celular…</td></tr>';
      return;
    }
    tbody.innerHTML = items.map((it, idx) => `
      <tr>
        <td>${idx+1}</td>
        <td><input type="number" min="0" value="${it.cantSalida ?? ''}" data-idx="${idx}" data-field="cantSalida"></td>
        <td><input type="text" value="${(it.descripcion || '').replace(/"/g,'&quot;')}" data-idx="${idx}" data-field="descripcion" style="min-width:220px"></td>
        <td>${it.fechaSalida || ''}</td>
        <td></td>
        <td><input type="number" min="0" data-idx="${idx}" data-field="cantIngreso"></td>
        <td><input type="text" placeholder="dd/mm/aaaa" data-idx="${idx}" data-field="fechaEntrada"></td>
        <td></td>
        <td><input type="text" data-idx="${idx}" data-field="observaciones"></td>
      </tr>
    `).join('');
    tbody.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('change', async (e) => {
        const idx = parseInt(e.target.getAttribute('data-idx'));
        const field = e.target.getAttribute('data-field');
        const session = await getSession(state.sessionCode);
        if(session && session.items[idx]){
          session.items[idx][field] = e.target.value;
          await saveSession(state.sessionCode, session);
        }
      });
    });
  }

  function startPolling(){
    if(state.pollTimer) clearInterval(state.pollTimer);
    let lastCount = -1;
    const poll = async () => {
      const session = await getSession(state.sessionCode);
      const pill = document.getElementById('live-pill');
      if(session){
        if(pill) pill.textContent = '● en vivo';
        if(session.items.length !== lastCount){
          renderTableRows(session.items);
          lastCount = session.items.length;
        }
      } else if(pill){
        pill.textContent = '○ sin conexión';
      }
    };
    poll();
    state.pollTimer = setInterval(poll, 3000);
  }

  async function exportXlsx(){
    const session = await getSession(state.sessionCode);
    const items = (session && session.items) || [];
    if(items.length === 0){ showToast('No hay registros todavía.'); return; }
    const XLSX = await import('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.mjs').catch(()=>null);
    if(!XLSX){ showToast('No se pudo cargar el generador de Excel.'); return; }
    const header = ['ID','CANT SALIDA','DESCRIPCIÓN','FECHA SALIDA','FIRMA','CANT INGRESO','FECHA ENTRADA','FIRMA','OBSERVACIONES'];
    const rows = items.map((it, idx) => [
      idx+1, it.cantSalida || '', it.descripcion || '', it.fechaSalida || '', '',
      it.cantIngreso || '', it.fechaEntrada || '', '', it.observaciones || ''
    ]);
    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Registro');
    XLSX.writeFile(wb, 'PS-F-104_registro_' + state.sessionCode + '.xlsx');
  }

  // ---------- PHONE: CONNECT ----------
  function renderPhoneConnect(){
    root.innerHTML = `
      <button class="rmc-back" id="back">← Volver</button>
      <div class="rmc-card">
        <h3 style="margin-top:0">Conectar con el PC</h3>
        <p class="rmc-muted">Ingresa el código de 4 dígitos que aparece en la pantalla del PC.</p>
        <div class="rmc-field">
          <span class="rmc-label">Código de sesión</span>
          <input type="tel" maxlength="4" id="code-input" placeholder="0000" style="font-family:var(--mono); font-size:22px; letter-spacing:6px; text-align:center">
        </div>
        <button class="rmc-btn" id="connect">Conectar</button>
      </div>
    `;
    document.getElementById('back').onclick = () => { state.view='home'; render(); };
    document.getElementById('connect').onclick = async () => {
      const code = document.getElementById('code-input').value.trim();
      if(code.length !== 4){ showToast('El código debe tener 4 dígitos.'); return; }
      const session = await getSession(code);
      if(!session){ showToast('No se encontró esa sesión. Revisa el código en el PC.'); return; }
      state.sessionCode = code;
      state.view = 'phone-capture';
      state.phoneStep = 'capture';
      state.photoBase64 = null;
      state.aiResult = null;
      render();
    };
  }

  // ---------- PHONE: CAPTURE / ANALYZE / SEND ----------
  function renderPhoneCapture(){
    root.innerHTML = `
      <button class="rmc-back" id="back">← Salir de la sesión</button>
      <div class="rmc-card">
        <span class="rmc-label">Conectado a la sesión</span>
        <div class="rmc-code" style="font-size:28px; padding:8px;">${state.sessionCode}</div>
      </div>
      <div class="rmc-card">
        <span class="rmc-label">1. Foto de la herramienta</span>
        <input type="file" accept="image/*" capture="environment" id="photo-input" style="display:block; margin:10px 0;">
        <img id="preview" class="rmc-photo-preview" style="display:none">
        <button class="rmc-btn" id="analyze-btn" disabled>Analizar herramienta con IA</button>
        <div id="analyze-status"></div>
      </div>
      <div id="result-zone"></div>
    `;
    document.getElementById('back').onclick = () => {
      state.view='home'; state.sessionCode=null; render();
    };
    const fileInput = document.getElementById('photo-input');
    const preview = document.getElementById('preview');
    const analyzeBtn = document.getElementById('analyze-btn');

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        state.photoBase64 = reader.result;
        preview.src = reader.result;
        preview.style.display = 'block';
        analyzeBtn.disabled = false;
        document.getElementById('result-zone').innerHTML = '';
      };
      reader.readAsDataURL(file);
    });

    analyzeBtn.addEventListener('click', analyzePhoto);
  }

  async function analyzePhoto(){
    const statusEl = document.getElementById('analyze-status');
    const btn = document.getElementById('analyze-btn');
    btn.disabled = true;
    statusEl.innerHTML = '<p class="rmc-muted"><span class="rmc-spinner" style="border-top-color:var(--rmc-red); border-color:rgba(200,16,46,0.25)"></span>Identificando marca, modelo y tipo…</p>';

    try{
      const base64 = state.photoBase64.split(',')[1];
      const mediaType = state.photoBase64.substring(5, state.photoBase64.indexOf(';'));
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 300,
          messages: [{
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
              { type: "text", text: "Eres un asistente para una bodega de herramientas industriales (marcas comunes: Stanley, Surtek, Bauker, Ingco, Urrea, Proto, Sata, Ridgid, Truper, Karson, Discover, Herragro). Observa la foto de la herramienta y responde SOLO con un objeto JSON, sin texto adicional ni markdown, con esta forma exacta: {\"marca\":\"...\",\"modelo\":\"...\",\"tipo\":\"...\",\"descripcion\":\"...\"}. El campo descripcion debe combinar tipo + marca + modelo en una frase corta en español, por ejemplo 'Flexómetro Stanley Pro 30-088'. Si no logras leer el modelo, deja modelo vacío y arma la descripcion solo con tipo + marca." }
            ]
          }]
        })
      });
      const data = await response.json();
      const textBlock = (data.content || []).find(b => b.type === 'text');
      let parsed;
      try{
        const clean = (textBlock ? textBlock.text : '{}').replace(/```json|```/g, '').trim();
        parsed = JSON.parse(clean);
      }catch(e){
        parsed = { marca:'', modelo:'', tipo:'', descripcion: 'No se pudo leer automáticamente, escribe la descripción manualmente.' };
      }
      state.aiResult = parsed;
      statusEl.innerHTML = '';
      btn.disabled = false;
      renderResult(parsed);
    }catch(e){
      statusEl.innerHTML = '<p class="rmc-muted" style="color:var(--rmc-red-dark)">No se pudo analizar la foto (revisa la conexión). Puedes escribir la descripción manualmente abajo.</p>';
      btn.disabled = false;
      renderResult({ marca:'', modelo:'', tipo:'', descripcion:'' });
    }
  }

  function renderResult(parsed){
    const zone = document.getElementById('result-zone');
    zone.innerHTML = `
      <div class="rmc-card rmc-result-card">
        <span class="rmc-label">2. Verifica y ajusta</span>
        <div class="rmc-field">
          <span class="rmc-label">Descripción (marca + modelo + tipo)</span>
          <input type="text" id="f-desc" value="${(parsed.descripcion||'').replace(/"/g,'&quot;')}">
        </div>
        <div class="rmc-field">
          <span class="rmc-label">Cantidad de salida</span>
          <input type="number" id="f-cant" min="1" value="1">
        </div>
        <button class="rmc-btn" id="send-btn">Enviar registro al PC</button>
      </div>
    `;
    document.getElementById('send-btn').onclick = sendRecord;
  }

  async function sendRecord(){
    const desc = document.getElementById('f-desc').value.trim();
    const cant = document.getElementById('f-cant').value || 1;
    if(!desc){ showToast('Escribe una descripción antes de enviar.'); return; }
    const btn = document.getElementById('send-btn');
    btn.disabled = true; btn.textContent = 'Enviando…';
    const session = await getSession(state.sessionCode);
    if(!session){ showToast('Se perdió la sesión. Vuelve a conectar.'); return; }
    session.items.push({
      descripcion: desc,
      cantSalida: cant,
      fechaSalida: today(),
      cantIngreso: '',
      fechaEntrada: '',
      observaciones: ''
    });
    const ok = await saveSession(state.sessionCode, session);
    if(ok){
      showToast('✓ Enviado al PC');
      state.photoBase64 = null;
      state.aiResult = null;
      state.view = 'phone-capture';
      render();
    } else {
      showToast('No se pudo enviar, intenta de nuevo.');
      btn.disabled = false; btn.textContent = 'Enviar registro al PC';
    }
  }

  function render(){
    if(state.view === 'home') renderHome();
    else if(state.view === 'pc-setup') renderPcSetup();
    else if(state.view === 'pc-dashboard') renderPcDashboard();
    else if(state.view === 'phone-connect') renderPhoneConnect();
    else if(state.view === 'phone-capture') renderPhoneCapture();
  }

  render();
})();
</script>
